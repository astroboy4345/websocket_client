<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket</title>
    <style>
        body {font-family: sans-serif; padding: 20px; background: #121212; color: #fff;}
        #log {background: #000; padding: 10px; height: 300px; overflow-y: scroll; border: 1px solid #333;}
        .status-on {color: #00ff00;}
        .status-off {color: #ff0000;}
    </style>
</head>
<body>
    <h1>WebSocket Broadcast Console</h1>
    <p id="status" class="status-off">Connecting....</p>

    <form id="message-form">
         <input id="message-input" type="text" placeholder="Enter Your message....." required />
         <button type="submit">Deploy Message</button>
    </form>

    <h3>Live Logs....</h3>
    <pre id="log"></pre>
</body>
<script>
    const statusEl = document.getElementById("status");
    const log = document.getElementById("log");
    const input = document.getElementById("message-input");

    //Initialize the handshake
    const socket = new WebSocket('https://websocket-chat-v3bv.onrender.com');

    const appendlog = (label,message) => {
        const entry = `${new Date().toLocaleTimeString()}
        ${label} ${message}\n`
        log.textContent = entry + log.textContent;
    }

    socket.addEventListener('open',()=>{
        statusEl.textContent = 'CONNECTED : https://websocket-chat-v3bv.onrender.com'
        statusEl.className = 'status-on';
        appendlog('[SYSTEM]','Tunnel Establishedt');
    })

    socket.addEventListener('close',()=>{
        statusEl.textContent = 'DISCONNECTED'
        statusEl.className = 'status-off';
        appendlog('[SYSTEM]','Tunnel Collapsed');
    })

    socket.addEventListener('message',(e)=>{
        appendlog('[RECEIVED]',e.data);
    })

    document.getElementById('message-form').addEventListener('submit',(e)=>{
        e.preventDefault();
        if(socket.readyState != WebSocket.OPEN){
            appendlog('[ERROR]','No active Tunnel Found');
        }
        const msg = input.value.trim();
        socket.send(msg);
        appendlog('[SENT]',msg);
        input.value = '';
    })


</script>
</html>
